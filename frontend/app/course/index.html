<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course — Ashura Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10221a;--muted:#52645a;--paper:#fbfaf5;--sheet:#ffffff;
  --line:#dfe5df;--green:#0d5c3a;--green-d:#08402a;--pencil:#f4c430;
  --ok:#0d7a44;--bad:#b3261e;
  --ok-tint:rgba(13,122,68,.1);--bad-tint:rgba(179,38,30,.08);
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:14px;--radius-sm:10px;--radius-lg:20px;
  --shadow-sm:0 1px 2px rgba(16,34,26,.06);
  --shadow:0 4px 16px rgba(16,34,26,.06);
}
@media (prefers-color-scheme:dark){:root{
  --ink:#eef3ee;--muted:#a3b3a9;--paper:#0d1a13;--sheet:#142419;--line:#1f3326;
  --green:#4fbb8a;--green-d:#3aa577;--ok:#4fbb8a;--bad:#ff8b85;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);
  font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:10;
  background:color-mix(in srgb,var(--paper) 94%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{max-width:1280px;margin:0 auto;padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:1.1rem;color:var(--ink);
  display:flex;align-items:center;gap:8px}
.brand-dot{color:var(--pencil);font-size:1.4rem}
.nav-link{color:var(--muted);font-weight:500}
.nav-link:hover{color:var(--green);text-decoration:none}
main{max-width:1280px;margin:0 auto;padding:32px 24px 96px}
.back{color:var(--muted);font-size:.92rem;display:inline-block;margin-bottom:20px}
.back:hover{color:var(--green);text-decoration:none}
.course-head{margin-bottom:32px}
.course-head h1{margin:0 0 6px;font-size:clamp(1.6rem,1.1rem + 1.6vw,2.2rem);
  letter-spacing:-.02em}
.course-head p{margin:0;color:var(--muted);font-size:1rem}
.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
  gap:24px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--sheet);border:1px solid var(--line);
  border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm)}
.panel h2{margin:0 0 4px;font-size:1.15rem;font-weight:600}
.panel .sub{color:var(--muted);font-size:.88rem;margin:0 0 16px}
.btn{display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:var(--radius-sm);
  border:1px solid var(--green);background:var(--green);color:#fff;
  font-weight:600;font-size:.92rem;transition:background .15s,transform .05s}
.btn:hover{background:var(--green-d)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--paper);border-color:var(--muted)}
.btn.sm{padding:6px 12px;font-size:.82rem}
textarea{width:100%;padding:12px 14px;font-family:inherit;font-size:.95rem;
  color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:var(--radius-sm);
  resize:vertical;transition:border-color .15s,box-shadow .15s}
textarea:focus{outline:none;border-color:var(--green);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 15%,transparent)}
#materialContent{min-height:120px}
#question{min-height:90px}
.form-row{display:flex;justify-content:flex-end;margin-top:10px;gap:8px}
.materials-list{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.material{background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:14px}
.material-head{display:flex;justify-content:space-between;align-items:center;
  font-size:.82rem;color:var(--muted);margin-bottom:6px}
.material-body{font-size:.9rem;white-space:pre-wrap;max-height:120px;overflow:auto;
  color:var(--ink);line-height:1.5}
.material.empty-state{color:var(--muted);font-style:italic;text-align:center;
  padding:24px;font-size:.9rem}
.answer-box{margin-top:20px;border-radius:var(--radius);padding:18px;
  border:1px solid var(--line);background:var(--paper);display:none}
.answer-box.show{display:block}
.badge{display:inline-flex;align-items:center;gap:6px;
  font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;
  margin-bottom:12px;letter-spacing:.01em}
.badge.ok{background:var(--ok-tint);color:var(--ok)}
.badge.none{background:var(--bad-tint);color:var(--bad)}
.answer-text{font-size:.98rem;line-height:1.6;color:var(--ink);white-space:pre-wrap}
.answer-actions{display:flex;gap:8px;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--line)}
.thinking{display:flex;align-items:center;gap:10px;
  color:var(--muted);font-size:.92rem;padding:16px 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);
  animation:bounce 1.2s infinite ease-in-out}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{opacity:.3;transform:scale(.8)}
  40%{opacity:1;transform:scale(1)}}
.thinking-note{color:var(--muted);font-size:.82rem;margin-top:8px;font-style:italic}
.alert{color:var(--bad);font-size:.88rem;margin-top:10px;
  padding:10px 14px;background:var(--bad-tint);border-radius:var(--radius-sm)}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <nav class="nav">
    <a class="brand" href="../../index.html"><span class="brand-dot">●</span>Ashura Study</a>
    <a class="nav-link" href="../">← All courses</a>
  </nav>
</header>
<main>
  <a href="../" class="back">← Back to all courses</a>
  <div class="course-head">
    <h1 id="title">Loading…</h1>
    <p id="desc"></p>
  </div>

  <div class="layout">
    <section class="panel">
      <h2>Course material</h2>
      <p class="sub">Paste text from your notes, textbook, or lecture slides. Answers come only from this material.</p>
      <form id="materialForm">
        <textarea id="materialContent" placeholder="Paste material here…" required></textarea>
        <div class="form-row">
          <button type="submit" class="btn" id="addBtn">Add material</button>
        </div>
      </form>
      <div class="materials-list" id="materialsList"></div>
    </section>

    <section class="panel">
      <h2>Ask about this course</h2>
      <p class="sub">If the answer isn't in your material, you'll know — no guessing.</p>
      <form id="askForm">
        <textarea id="question" placeholder="e.g. What is the electron configuration of Cl−?" required></textarea>
        <div class="form-row">
          <button type="submit" class="btn" id="askBtn">Ask</button>
        </div>
      </form>
      <div class="answer-box" id="answerBox"></div>
    </section>
  </div>
</main>

<script>
const API='http://localhost:6691';
const REFUSAL="That's not covered in the uploaded material.";
const $=s=>document.querySelector(s);
const params=new URLSearchParams(location.search);
const courseId=params.get('id');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let course=null;

async function loadCourse(){
  if(!courseId){
    $('#title').textContent='No course selected';
    $('#desc').textContent='Open a course from the list.';
    return;
  }
  try{
    const res=await fetch(`${API}/courses`);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const list=await res.json();
    course=list.find(c=>c.id===courseId);
    if(!course){
      $('#title').textContent='Course not found';
      $('#desc').textContent='It may have been removed (server restarted?). Go back and pick another.';
      return;
    }
    $('#title').textContent=course.name;
    $('#desc').textContent=course.description||'';
    renderMaterials();
  }catch(err){
    $('#title').textContent="Can't reach the API";
    $('#desc').innerHTML=`Make sure the server is running — <code>cd api && npm start</code> (${esc(err.message)})`;
  }
}

function renderMaterials(){
  const el=$('#materialsList');
  if(!course.materials.length){
    el.innerHTML='<div class="material empty-state">No material yet. Paste some above to get started.</div>';
    return;
  }
  el.innerHTML=course.materials.map((m,i)=>`
    <div class="material">
      <div class="material-head"><span>Material ${i+1}</span><span>${m.length} chars</span></div>
      <div class="material-body">${esc(m)}</div>
    </div>`).join('');
}

$('#materialForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const content=$('#materialContent').value.trim();
  const btn=$('#addBtn');
  if(!content||!course) return;
  btn.disabled=true;btn.textContent='Adding…';
  try{
    const res=await fetch(`${API}/courses/${encodeURIComponent(course.id)}/materials`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({content})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    course=await res.json();
    $('#materialContent').value='';
    renderMaterials();
  }catch(err){
    alert('Could not add material: '+err.message);
  }finally{
    btn.disabled=false;btn.textContent='Add material';
  }
});

$('#askForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const question=$('#question').value.trim();
  const btn=$('#askBtn');
  const box=$('#answerBox');
  if(!question||!course) return;
  if(!course.materials.length){
    box.className='answer-box show';
    box.innerHTML='<div class="alert">Add some material first — the model only answers from your pasted notes.</div>';
    return;
  }
  btn.disabled=true;btn.textContent='Thinking…';
  box.className='answer-box show';
  box.innerHTML=`<div class="thinking">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span>Asking the model…</span>
    </div>
    <div class="thinking-note" id="slowNote"></div>`;
  const slowNote=$('#slowNote');
  const t1=setTimeout(()=>{if(slowNote)slowNote.textContent='CPU inference can take 15–30 seconds…';},4000);
  const t2=setTimeout(()=>{if(slowNote)slowNote.textContent='Still going — almost there…';},15000);
  try{
    const res=await fetch(`${API}/courses/${encodeURIComponent(course.id)}/ask`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const {answer}=await res.json();
    const trimmed=(answer||'').trim();
    const isRefusal=trimmed===REFUSAL||trimmed.toLowerCase().startsWith("that's not covered");
    box.innerHTML=`
      <span class="badge ${isRefusal?'none':'ok'}">
        ${isRefusal?'⚠ Not covered in material':'✓ Grounded in your material'}
      </span>
      <div class="answer-text">${esc(trimmed||'(empty)')}</div>
      <div class="answer-actions">
        ${!isRefusal?'<button type="button" class="btn ghost sm" id="copyBtn">Copy</button>':''}
        <button type="button" class="btn ghost sm" id="clearBtn">Clear</button>
      </div>`;
    if(!isRefusal){
      $('#copyBtn').addEventListener('click',async()=>{
        try{await navigator.clipboard.writeText(trimmed);
          $('#copyBtn').textContent='Copied ✓';
          setTimeout(()=>{$('#copyBtn').textContent='Copy';},1500);
        }catch{}
      });
    }
    $('#clearBtn').addEventListener('click',()=>{box.className='answer-box';box.innerHTML='';});
  }catch(err){
    box.innerHTML=`<div class="alert">Couldn't get an answer: ${esc(err.message)}. Is Ollama running? (<code>ollama serve</code>)</div>`;
  }finally{
    clearTimeout(t1);clearTimeout(t2);
    btn.disabled=false;btn.textContent='Ask';
  }
});

loadCourse();
</script>
</body>
</html>
